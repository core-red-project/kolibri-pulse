# Pre-commit configuration (POSIX/Bash based)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: lint
        name: Source Code Hygiene & Linting
        entry: bash scripts/lint.sh
        language: system
        files: ^(src/|scripts/|Makefile|Justfile|build\.sh)
        pass_filenames: false
